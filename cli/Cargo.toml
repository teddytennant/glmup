[package]
name = "glm"
version = "0.1.0"
edition = "2021"
description = "Start, stop and watch the GLM-5.3-Flash sglang job on a Slurm cluster"
license = "MIT"

[[bin]]
name = "glm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
console = "0.15"
dirs = "6"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
ureq = "3"

[profile.release]
strip = true
lto = "thin"
